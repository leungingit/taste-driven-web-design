<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主题画廊</title>
<!--
  使用说明（智能体）：复制为 .taste-design/work/theme/gallery.html，不需要修改。
  它读取同目录的 axes.json，把 prototype 指向的原型按每个组合渲染（在原型的 <html> 上设置 data-preset / data-<维度>），
  并实时检查 contrast_pairs 的对比度。需要通过决策服务打开（http://localhost:8765/files/work/theme/gallery.html），
  直接双击打开时浏览器会拦截读取 axes.json。
  用途：作为阶段 5 验收决策的 media（display: "wide"），让用户一眼看到所有组合是否仍是同一个产品。
-->
<style>
:root{--bg:#f4f1ec;--card:#fffdf9;--ink:#1d1b18;--mute:#6d675e;--line:#ddd6ca;--acc:#c2410c;--ok:#2f6f3e;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1f1e1b;--ink:#eee8de;--mute:#a1998c;--line:#35322d;--acc:#fb8a4a;--ok:#7cc48c;--bad:#ff8a80}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}.mute{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:transparent;color:var(--ink);padding:5px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.inv{padding:10px 16px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.inv b{color:var(--ink)}
main{padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.c.def{outline:2px solid var(--acc)}
.th{position:relative;width:100%;aspect-ratio:var(--ar);overflow:hidden;background:#fff}
.th iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
.cap{padding:8px 10px;font-size:13px}.cap code{font-size:12px}
.chk{font-size:12px;margin-top:4px}
.err{padding:40px;text-align:center;color:var(--bad)}
</style>
</head>
<body>
<header><b>主题画廊</b><span class="mute" id="sum"></span><span style="flex:1"></span>
  <span class="mute">预览宽度</span><div class="seg" id="w"><button data-w="375">375</button><button data-w="768">768</button><button data-w="1440" aria-pressed="true">1440</button></div></header>
<div class="inv" id="inv"></div>
<main id="m"></main>
<script>
(async function(){
  const m=document.getElementById("m"); let spec;
  try{ spec=await (await fetch("axes.json",{cache:"no-store"})).json(); }
  catch(e){ m.outerHTML='<div class="err">读不到 axes.json。请通过决策服务打开本页（/files/work/theme/gallery.html）。</div>'; return; }
  const dims=[]; if((spec.presets||[]).length) dims.push(["preset",spec.presets.map(p=>p.id)]);
  for(const a of spec.axes||[]) dims.push([a.id,a.values]);
  const label=(k,v)=>{ if(k==="preset"){const p=spec.presets.find(x=>x.id===v);return p?p.label||v:v} const a=(spec.axes||[]).find(x=>x.id===k);return (a&&a.labels&&a.labels[v])||v };
  const combos=dims.reduce((acc,[k,vs])=>acc.flatMap(c=>vs.map(v=>({...c,[k]:v}))),[{}]);
  const dflt=spec.default||{};
  document.getElementById("inv").innerHTML="<b>所有组合都不变：</b>"+(spec.invariants||[]).map(x=>x.replace(/[<>&]/g,"")).join(" · ");
  let W=1440; const H=()=>Math.round(W*(W<600?2.0:W<1000?1.3:0.625));
  function lum(c){const m=c.match(/[\d.]+/g); if(!m) return null; const [r,g,b]=m.slice(0,3).map(x=>{x=+x/255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b}
  function resolve(doc,v){const el=doc.createElement("span"); el.style.color=`var(${v})`; doc.body.append(el); const c=getComputedStyle(el).color; el.remove(); return c}
  function draw(){
    m.style.setProperty("--ar",`${W}/${H()}`); document.documentElement.style.setProperty("--ar",`${W}/${H()}`);
    m.innerHTML=""; let bad=0, done=0;
    combos.forEach(c=>{
      const isDef=Object.entries(c).every(([k,v])=>dflt[k]===v);
      const card=document.createElement("div"); card.className="c"+(isDef?" def":"");
      card.innerHTML=`<div class="th"><iframe title="${Object.values(c).join(" ")}" loading="lazy"></iframe></div><div class="cap">${Object.entries(c).map(([k,v])=>`<code>${k}</code> ${label(k,v)}`).join(" · ")}${isDef?' · <b>默认</b>':""}<div class="chk mute">检查对比度中…</div></div>`;
      m.append(card);
      const f=card.querySelector("iframe"), th=card.querySelector(".th");
      f.style.width=W+"px"; f.style.height=H()+"px";
      const fit=()=>{f.style.transform=`scale(${th.clientWidth/W})`}; fit(); new ResizeObserver(fit).observe(th);
      f.onload=()=>{ try{
          const d=f.contentDocument, html=d.documentElement;
          for(const [k,v] of Object.entries(c)) html.setAttribute(`data-${k}`,v);
          requestAnimationFrame(()=>{ const out=[];
            for(const [fg,bg,min] of spec.contrast_pairs||[]){ const a=lum(resolve(d,fg)), b=lum(resolve(d,bg)); if(a==null||b==null){out.push(`<span class="bad">${fg} / ${bg} 未定义</span>`);bad++;continue}
              const r=(Math.max(a,b)+.05)/(Math.min(a,b)+.05); const ok=r>=(min||4.5); if(!ok) bad++;
              out.push(`<span class="${ok?"ok":"bad"}">${fg.replace("--","")}/${bg.replace("--","")} ${r.toFixed(2)}</span>`) }
            card.querySelector(".chk").innerHTML=out.join(" · ")||"未配置 contrast_pairs"; done++;
            document.getElementById("sum").innerHTML=`${combos.length} 个组合${done===combos.length?(bad?` · <span class="bad">${bad} 处对比度不达标</span>`:' · <span class="ok">对比度全部达标</span>'):""}`;
          });
        }catch(e){ card.querySelector(".chk").innerHTML='<span class="bad">无法访问原型页面（需同源打开）</span>' } };
      f.src=spec.prototype;
    });
    document.getElementById("sum").textContent=`${combos.length} 个组合`;
  }
  document.getElementById("w").onclick=e=>{const w=+e.target.dataset.w; if(!w) return; W=w; document.querySelectorAll("#w button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.w===W))); draw()};
  draw();
})();
</script>
</body>
</html>
