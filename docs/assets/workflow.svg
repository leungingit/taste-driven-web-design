<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">从一句意向，到可验收的设计。</title>
<desc id="desc">你提供目标与判断，智能体把选择变成具体设计。 对齐意向 → 看样张选择 → 制作与打磨 → 验收并铺开 → 交付与接续</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#a7ac9d" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="500" rx="24" fill="#182d25"/>
<g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
<text x="44" y="52" fill="#d9b97d" font-size="15" letter-spacing="2">TASTE-DRIVEN WEB DESIGN / WORKFLOW</text>
<text x="44" y="108" fill="#f3f1e8" font-size="38" font-weight="650">从一句意向，到可验收的设计。</text>
<text x="44" y="146" fill="#bcc9bc" font-size="20">你提供目标与判断，智能体把选择变成具体设计。</text>
<rect x="44" y="183" width="244" height="175" rx="14" fill="#f3f1e8"/>
<text x="64" y="220" fill="#927040" font-size="17">01</text>
<text x="64" y="257" fill="#243b30" font-size="22" font-weight="650">对齐意向</text>
<text x="64" y="294" fill="#485a4f" font-size="15">目标、范围、参考图</text>
<text x="64" y="321" fill="#485a4f" font-size="15">只有文字时，先邀请补图</text>
<path d="M293 270 H305" stroke="#a7ac9d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="312" y="183" width="244" height="175" rx="14" fill="#f3f1e8"/>
<text x="332" y="220" fill="#927040" font-size="17">02</text>
<text x="332" y="257" fill="#243b30" font-size="22" font-weight="650">看样张选择</text>
<text x="332" y="294" fill="#485a4f" font-size="15">方向、字体、色彩与细节</text>
<text x="332" y="321" fill="#485a4f" font-size="15">放大查看，比较后再决定</text>
<path d="M561 270 H573" stroke="#a7ac9d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580" y="183" width="244" height="175" rx="14" fill="#f3f1e8"/>
<text x="600" y="220" fill="#927040" font-size="17">03</text>
<text x="600" y="257" fill="#243b30" font-size="22" font-weight="650">制作与打磨</text>
<text x="600" y="294" fill="#485a4f" font-size="15">原型、令牌与代表页面</text>
<text x="600" y="321" fill="#485a4f" font-size="15">备注落实到具体产物</text>
<path d="M829 270 H841" stroke="#a7ac9d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="848" y="183" width="244" height="175" rx="14" fill="#f3f1e8"/>
<text x="868" y="220" fill="#927040" font-size="17">04</text>
<text x="868" y="257" fill="#243b30" font-size="22" font-weight="650">验收并铺开</text>
<text x="868" y="294" fill="#485a4f" font-size="15">逐阶段确认，再扩展全站</text>
<text x="868" y="321" fill="#485a4f" font-size="15">检查响应式与一致性</text>
<path d="M1097 270 H1109" stroke="#a7ac9d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1116" y="183" width="244" height="175" rx="14" fill="#f3f1e8"/>
<text x="1136" y="220" fill="#927040" font-size="17">05</text>
<text x="1136" y="257" fill="#243b30" font-size="22" font-weight="650">交付与接续</text>
<text x="1136" y="294" fill="#485a4f" font-size="15">实际源码、说明与记录</text>
<text x="1136" y="321" fill="#485a4f" font-size="15">长流程可按记录恢复</text>
<path d="M56 400 H1340" stroke="#ffffff25"/>
<text x="44" y="435" fill="#e5dcc5" font-size="20">选择、备注、产物与验证随项目保留，下一轮从已确认的结论继续。</text>
<text x="44" y="471" fill="#a7b9aa" font-size="15">流程概览示意 · 完整流程包含阶段 0–9，按确认范围调整轨道</text>
</g></svg>
